<app-header />


<main class="w-[100%] h-[85vh] flex justify-around items-center flex-col">
  <section
    class="flex flex-col justify-between items-center py-[2rem] h-[95%] w-[50%] bg-black border-[1px] border-solid border-orange rounded-xl"
  >


    <h3 class="text-white font-tittle text-3xl font-bold">
      Faça Login no Sistema
    </h3>




  <form
    class="h-[90%] w-[80%] rounded-t-xl flex flex-col justify-around items-center"
    [formGroup]="loginForm"
    (submit)="entrar()"
  >


    <div class="h-[50%] w-[100%] flex flex-col justify-around items-center">
      <!--  Email  -->
      <p-inputgroup
        class="w-[100%]"
      >
      <!--  Icon  -->
      <p-inputgroup-addon>
        <i class="pi pi-user"></i>
      </p-inputgroup-addon>


        <!--  Input w/ label  -->
        <p-float-label variant="on">
          <input
            formControlName="email"
            pInputText
            type="email"
            id="inputLoginEmail"
          />
          <label for="inputLoginEmail">Digite seu Email:</label>
        </p-float-label>
      </p-inputgroup>






      <!--  Pass  -->
      <p-inputgroup>
        <p-inputgroup-addon>
          <i class="pi pi-key"></i>
        </p-inputgroup-addon>


        <p-float-label variant="on">
          <input
            type="password"
            pInputText
            formControlName="password"
            id="inputLoginPass"
          />
          <label for="inputLoginPass">Digite sua Senha:</label>
        </p-float-label>
      </p-inputgroup>
    </div>





    <p-button
      type="submit"
      label="Entrar no Sistema"
      size="large"
    />




  </form>

  </section>
</main>
