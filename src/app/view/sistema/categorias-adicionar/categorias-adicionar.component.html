<main class="min-h-[85vh] w-[100%] flex items-start justify-end">

  <app-menu-bar />



  <section class="w-[75%] right-0 h-auto flex flex-col items-center justify-around pr-8">

    <section class="w-[100%] height-24 flex items-center justify-start" >
      <h1 class="text-white font-tittle font-bold text-3xl min-h-[7rem] flex items-center justify-around">
        Adicionar nova categoria
      </h1>
    </section>



    <form
      [formGroup]="formCategoria"
      class="bg-black border-orange border-1 min-h-96 h-auto w-[100%] flex flex-col items-center justify-around rounded-xl py-8"
      (submit)="criarCategoria()"
    >

    <section class="w-[100%] h-32 flex items-center justify-between flex-col">
        <!--  Nome  -->
        <p-floatlabel variant="on" class="w-[90%]">
          <input
            formControlName="nome"
            pInputText
            class="w-[100%]"
            id="editarItensNome"
          />
          <label for="editarItensNome">Nome da Categoria:</label>
        </p-floatlabel>


        <div class="flex items-center justify-between w-[90%] ">
          <div class="flex items-center justify-between h-[3.5rem] w-[50%] px-4 border border-gray-700 rounded-md bg-gray-800">
            <span class="text-gray-300 text-sm">Status da Conta</span>
            <p-toggleswitch formControlName="ativo" inputId="ativo" />
          </div>


          <button
            pButton
            type="submit"
            [loading]="isLoading"
            icon="pi pi-check"
            class="w-[30%] h-12 font-bold text-xl font-tittle"
          >
            Criar Item
          </button>
        </div>
      </section>
    </form>



  </section>
   <!-- Componentes Necessários para Confirmação e Feedback -->
  <p-toast></p-toast>
</main>
