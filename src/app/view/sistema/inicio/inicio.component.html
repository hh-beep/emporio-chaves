<main class="bg-black min-h-[85vh] w-[100%] flex flex-col items-center justify-around">

  <!--  Uhhh, apenas para um menu de CRUD inicial simples, aqui temos a ideia base do sistema de itens e Adicionar Itens e talz  -->
  <h1 class="text-white font-tittle font-bold text-3xl min-h-[7rem] flex items-center justify-around">
    Bem-vindo ao Sistema!
  </h1>


  <a
    class="h-[6rem] w-[30%] border-orange border-solid border-[5px] rounded-xl flex items-center justify-around text-orange text-3xl font-bold buttonAdd"
    (click)="redirectPath(  'sistema/adicionar-item/'  )"
  >
    Adicionar novo item
  </a>



  <ul class="h-[auto] w-[75%] flex justify-around items-center flex-col">
    @for (  item of itemsData; track item.id  ) {
      <li class="h-[15rem] bg-white w-[60%] mt-[2rem] rounded-xl py-[1rem] px-[2rem] flex flex-col items-start justify-between">

        <h3 class="text-orange font-bold text-2xl font-tittle">
          {{  item.name  }}
        </h3>


        <p class="text-grey text-1xl ">
          {{  item.desc  }}
        </p>



        <section class="h-[50%] w-[100%] flex items-center justify-between">
          <section class="w-[40%] h-[100%] flex justify-around items-center">
            <button
              class="text-orange text-6xl font-tittle font-bold"
              (click)="itemQuantMinus(  item.id  )"
            >
              -
            </button>
            <p
              class="text-black text-3xl font-tittle font-bold"
            >
              {{  item.quant  }}
            </p>
            <button
              class="text-orange text-5xl font-tittle font-bold"
              (click)="itemQuantPlus(  item.id  )"
            >
              +
            </button>
          </section>


          <section class="w-[40%] h-[100%] flex justify-around items-end flex-col">
            <button
              class="h-[40%] w-[70%] border-yellow border-[5px] border-solid rounded-md buttonAdd-Yellow mx-[0.5rem] font-tittle font-bold text-yellow"
              (click)="redirectPath('sistema/editar-item/' + item.id)"
            >
              Editar Item
            </button>




            <button
              class="h-[40%] w-[70%] border-orange border-[5px] border-solid rounded-md buttonAdd mx-[0.5rem] font-tittle font-bold text-orange"
              (click)="removeItem(  item.id  )"
            >
              Remover Item
            </button>
          </section>
        </section>



      </li>
    }
    @empty {
      <h2 class="text-orange font-tittle font-bold text-3xl">
        Não possui itens no sistema!!!
      </h2>
    }
  </ul>



</main>
