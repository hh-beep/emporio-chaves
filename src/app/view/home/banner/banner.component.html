<section class="flex h-[85vh] w-[100vw] items-center justify-around">
  <section class=" w-[95%] h-[100%] flex items-center justify-between">

    <section class="flex items-center justify-around flex-col w-[45%] h-[100%]">
      <div class="w-[100%] h-[90%] bg-black rounded-lg flex items-start justify-around flex-col px-[1.5rem] py-[0.5rem] border-[1px] border-solid border-orange">


        <!--  Textos  -->
        <span class="w-[60%] h-[10%] border-orange border-[1px] border-solid rounded-full flex items-center justify-around">
          <p class="text-orange font-text text-1xl">
            Chaveiro 24 horas
          </p>
        </span>
        <h1 class="text-white font-tittle text-5xl font-bold">
          <span class="text-6xl text-orange">Empório</span><br> das Chaves
        </h1>
        <p class="text-grey font-text text-[1.25rem]">
          Serviço de chaveiro com agilidade, segurança e confiança! Atendimento 24 horas para você!
        </p>



        <!--  Btn e Detail  -->
        <section class="flex h-[15%] w-[100%] items-center px-[0.5rem]">
          <p-button
            (click)="navigatePath(['catalogo'])"
            icon="pi pi-list"
            size="large"
            label="Ver Catalogo"
            class="mr-[1rem]"
          />


          <p-button
            severity="secondary"
            variant="outlined"
            (click)="navigatePath(['contato'])"
            icon="pi pi-phone"
            label="Entrar em contato"
          />
        </section>
      </div>
    </section>



    <!--  Imagem Principal  -->
    <figure class="h-[100%] w-[50%] flex items-center justify-around">
      <img
        class="h-auto w-[90%]"
        src="./assets/Logo.png"
      >
    </figure>


  </section>
</section>
